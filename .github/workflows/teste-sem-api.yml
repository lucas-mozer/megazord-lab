name: Teste sintetico sem APIs

on:
  pull_request:
    paths:
      - ".github/workflows/teste-sem-api.yml"
      - "tests/test_handoff.py"
      - "tests/test_compact_md.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar passagem sintetica (sem APIs)
        run: python3 -m unittest discover -s tests -p 'test_handoff.py' -v
